<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市场判断日志 · 知行间</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#10151c;color:#eaf0f8}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:30px 18px 90px}a{color:#8db9ff}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(27px,5vw,42px);margin:30px 0 8px}h2{font-size:21px;margin:0 0 16px}p{color:#a6b3c4;line-height:1.8}.intro{max-width:760px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}button,select,input,textarea{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #38485b;background:#1a2532;color:#eaf0f8}button{cursor:pointer}button.active{background:#274c80;border-color:#5387ce}button:hover{border-color:#83b5f5}.entry{background:#18212d;border:1px solid #334255;border-radius:15px;padding:22px;margin:18px 0}.entry h2{margin:10px 0}.meta{color:#91a2b6;font-size:13px}.tag{display:inline-block;font-size:12px;border:1px solid #50627a;border-radius:20px;padding:4px 9px;color:#c7d7ed}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{padding:15px;background:#111b27;border-radius:11px}.pane h3{font-size:14px;margin:0 0 10px;color:#a9caff}.pane p{margin:7px 0;color:#e0e8f2}.quote{border-left:3px solid #6599eb;padding-left:12px;white-space:pre-wrap}.timeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}.step{padding:8px 11px;border-radius:8px;background:#263448;font-size:13px}.arrow{color:#788ba5}.outcome{border-top:1px solid #3b495b;padding-top:13px;margin-top:16px}.pending{color:#f6ce7b}.foot{font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:#a8b7c8;font-size:13px}.field.wide{grid-column:1/-1}textarea{width:100%;min-height:80px;resize:vertical}.formgrid input,.formgrid select{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}#msg{font-size:13px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #354253;text-align:left;padding:11px 7px;font-size:13px}th{color:#a8b9cd}#empty{display:none}@media(max-width:650px){.columns,.formgrid{grid-template-columns:1fr}.entry{padding:16px}.field.wide{grid-column:auto}}
</style></head><body><main><header><a href="./">← 返回知行间</a><span class="tag">理解 → 判断 → 验证</span></header>
<h1>市场判断日志</h1><p class="intro">记录市场消息、当时的个人判断，以及后续行情如何验证。坚持保留原始观点，将个人判断、助手分析和事后结果分开，避免事后修改预测。</p>
<div class="toolbar"><button class="active" data-filter="all">全部记录</button><button data-filter="pending">待验证</button><button data-filter="reviewed">已复盘</button></div>
<div id="entries"></div><p id="empty">暂无符合条件的记录。</p>
<section class="entry"><h2>新增判断（仅当前浏览器保存）</h2><p>可先在这里整理新判断并导出 JSON；这不会自动发布到 GitHub。需要公开的记录可以继续在对话中提交更新。</p><form id="newEntry" class="formgrid">
<label class="field">记录日期<input name="date" type="date" required></label><label class="field">主题<input name="title" placeholder="例如：流动性政策" required></label>
<label class="field wide">消息内容<textarea name="news" required></textarea></label>
<label class="field wide">我的原始判断<textarea name="opinion" required></textarea></label>
<label class="field">预测方向<select name="direction"><option value="上涨">上涨</option><option value="下跌">下跌</option><option value="震荡">震荡</option><option value="不确定">不确定</option></select></label>
<label class="field">观察对象<input name="target" value="上证指数 / A股市场"></label>
<label class="field wide">验证期限（可空）<input name="horizon" placeholder="例如：后续1至3个交易日"></label>
<div class="field wide"><div class="actions"><button type="submit">保存本机记录</button><button type="button" id="export">导出全部记录 JSON</button><button type="button" id="reset">清除本机新增记录</button></div><p id="msg"></p></div></form></section>
<p class="foot">数据说明：以下初始内容是对话中的观点档案，不代表投资建议；行情结果、政策效果与消息出处尚待独立核验。未明确指定的第二条消息不擅自补写。发布版本与本机新增内容分开保存。</p>
</main><script>
const published=[
{id:"2026-11-01-buyback",date:"2026-11-01",title:"回购增持与支持资本市场工具",news:"讨论央行、证监会推动支持资本市场工具使用，以及股票回购增持再贷款等政策工具。",opinion:"昨天那个回购增持就很好，就是利好 ETF。",direction:"上涨",target:"宽基ETF / A股市场",horizon:"政策消息后的短期市场表现",observation:"用户于11月2日回顾：今天A全面涨。",analysis:"回购增持融资支持可能增加符合条件主体的买入能力，并改善市场预期；这并不等于ETF本身一定获得同等规模的直接资金流入。",result:"待核验当日行情及ETF净申购数据",status:"pending",source:"用户对话记录（政策内容为讨论摘要，非原文新闻链接）"},
{id:"2026-11-02-continuation",date:"2026-11-02",title:"市场利好延续与下一波上涨预测",news:"用户提到今天还有一条此前讨论过的消息，具体标题与内容尚未明确。",opinion:"今天 A 全面涨，而且今天还有我和你说的那个消息，我认为也是利好，还会延续今天的形式，再涨一波。",direction:"上涨",target:"A股市场",horizon:"后续交易日（未明确具体期限）",observation:"用户观察：11月2日A股全面上涨；尚未独立核验。",analysis:"这是对行情延续性的方向判断。后续需结合指数涨跌、市场广度、成交量及ETF资金流向检验，而不能仅凭消息本身确认。",result:"等待后续行情验证",status:"pending",source:"用户于2026-11-02的原始表达"}
];
const key="zhixingjian_market_journal_v1";let local=[];try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v))local=v}catch{}
let filter="all";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(){const items=[...published,...local].sort((a,b)=>b.date.localeCompare(a.date));const shown=items.filter(x=>filter==="all"||x.status===filter);document.getElementById("empty").style.display=shown.length?"none":"block";document.getElementById("entries").innerHTML=shown.map(x=>`<article class="entry"><div class="meta">${esc(x.date)} · ${esc(x.target)} · ${x.status==="pending"?"待验证":"已复盘"}${x.local?" · 本机记录":""}</div><h2>${esc(x.title)}</h2><div class="timeline"><span class="step">消息</span><span class="arrow">→</span><span class="step">判断：${esc(x.direction)}</span><span class="arrow">→</span><span class="step">观察</span><span class="arrow">→</span><span class="step">验证</span></div><div class="columns"><div class="pane"><h3>消息背景</h3><p>${esc(x.news)}</p><h3>我的原始判断</h3><p class="quote">${esc(x.opinion)}</p></div><div class="pane"><h3>助手分析（与原话分开）</h3><p>${esc(x.analysis||"尚未分析")}</p><h3>观察对象 / 期限</h3><p>${esc(x.target)} · ${esc(x.horizon||"未指定")}</p></div></div><div class="outcome"><h3>行情观察</h3><p>${esc(x.observation||"尚未填写")}</p><h3>验证结果</h3><p class="pending">${esc(x.result||"待验证")}</p><p class="meta">来源：${esc(x.source||"本机录入")}</p></div></article>`).join("")}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));draw()}));
document.getElementById("newEntry").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target);const get=k=>String(f.get(k)||"").trim();local.push({id:"local-"+Date.now(),local:true,status:"pending",date:get("date"),title:get("title"),news:get("news"),opinion:get("opinion"),direction:get("direction"),target:get("target"),horizon:get("horizon"),analysis:"",observation:"",result:"等待后续行情验证",source:"当前浏览器手动录入"});localStorage.setItem(key,JSON.stringify(local));e.target.reset();document.getElementById("msg").textContent="已保存在本机浏览器，未发布到 GitHub。";draw()});
document.getElementById("export").addEventListener("click",()=>{const blob=new Blob([JSON.stringify([...published,...local],null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="market-judgments.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById("reset").addEventListener("click",()=>{if(!confirm("确定清除当前浏览器新增的记录吗？"))return;local=[];localStorage.removeItem(key);document.getElementById("msg").textContent="本机新增记录已清除。";draw()});draw();
</script></body></html>
